<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il Castello Incantato</title>
  <meta name="theme-color" content="#2a1810">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a0f0a;
      color: #f4e8d1;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
      text-align: center;
    }
    .card {
      background: #2a1810;
      border: 3px solid #8b5a2b;
      border-radius: 12px;
      padding: 20px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }
    h1 { color: #d4af37; font-size: 1.8rem; margin-bottom: 8px; text-shadow: 1px 1px 3px #000; }
    h2 { color: #c0a060; font-size: 1.1rem; margin-bottom: 20px; font-style: italic; }
    .btn {
      display: block;
      width: 100%;
      background: #5a2a18;
      color: #fff;
      border: 2px solid #8b5a2b;
      padding: 14px;
      margin: 10px 0;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:active { background: #8b5a2b; }
    .status-bar {
      display: flex;
      justify-content: space-around;
      background: #150a06;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }
    .hidden { display: none; }
    .game-text { text-align: left; font-size: 1rem; line-height: 1.5; margin-bottom: 15px; }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #8b5a2b;
      background: #150a06;
      color: #fff;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="card" id="menu-screen">
    <h1>IL CASTELLO INCANTATO</h1>
    <h2>La Corona Dorata & La Lucciola Magica</h2>
    
    <p style="margin-bottom: 20px;">Scegli la modalità di gioco:</p>
    
    <button class="btn" onclick="startGame('facile')">🟢 FACILE (6-8 Anni)<br><small>Aiuti illimitati, Checkpoint attivi</small></button>
    <button class="btn" onclick="startGame('normale')">🔥 DIFFICILE (9-10 Anni)<br><small>3 Aiuti totali, logica avanzata</small></button>
    <button class="btn" onclick="startGame('esperto')">👑 ADULTI / ESPERTO<br><small>0 Aiuti, danni fatali!</small></button>
  </div>

  <div class="card hidden" id="game-screen">
    <div class="status-bar">
      <div>Stanza: <span id="room-num">1</span>/20</div>
      <div>HP: <span id="hp-val">100</span></div>
      <div>Aiuti: <span id="hints-val">3</span></div>
    </div>
    
    <div class="game-text" id="puzzle-desc">Descrizione enigma...</div>
    
    <div id="answer-container">
      <input type="text" id="answer-input" placeholder="Inserisci la risposta...">
      <button class="btn" onclick="checkAnswer()">Conferma Risposta</button>
      <button class="btn" id="hint-btn" style="background: #3a4a18;" onclick="useHint()">Chiedi Aiuto</button>
    </div>
    <div id="feedback" style="margin-top: 10px; font-weight: bold;"></div>
  </div>

  <script>
    const puzzles = [
      { desc: "Stanza 1: Ho un collo ma non la testa. Cosa sono?", ans: "bottiglia", hint: "Contiene liquidi." },
      { desc: "Stanza 2: Più ne togli, più ne lasci dietro di te. Cosa sono?", ans: "passi", hint: "Li fai camminando." },
      { desc: "Stanza 3: Ho la chiave ma non la serratura. Chi sono?", ans: "pianoforte", hint: "Produce note musicali." },
      { desc: "Stanza 4: Passo attraverso il vetro senza romperlo. Cosa sono?", ans: "luce", hint: "Illumina la stanza." },
      { desc: "Stanza 5: Completa la sequenza numerica magica: 2, 4, 8, 16, ...?", ans: "32", hint: "Raddoppia ogni numero." },
      { desc: "Stanza 6: Più sono caldo, più sono fresco. Cosa sono?", ans: "pane", hint: "Si compra dal fornaio." },
      { desc: "Stanza 7: Vado su e giù senza mai muovermi. Cosa sono?", ans: "scala", hint: "Collega due piani." },
      { desc: "Stanza 8: Che cosa ha una testa e una coda, ma nessun corpo?", ans: "moneta", hint: "Si usa per pagare." },
      { desc: "Stanza 9: Si spezza appena dici il suo nome. Cos'è?", ans: "silenzio", hint: "L'assenza di rumore." },
      { desc: "Stanza 10: Se mi hai, vuoi condividermi. Se mi condividi, non mi hai più. Cos'è?", ans: "segreto", hint: "Non va detto a nessuno." },
      { desc: "Stanza 11: Ho molte pagine ma non so parlare. Cosa sono?", ans: "libro", hint: "Si legge." },
      { desc: "Stanza 12: Quale parola diventa più corta se le aggiungi due lettere?", ans: "corta", hint: "È un gioco di parole letterale." },
      { desc: "Stanza 13: Appartiene a te, ma gli altri lo usano più di te. Cos'è?", ans: "nome", hint: "Te lo hanno dato i tuoi genitori." },
      { desc: "Stanza 14: Vola senza ali, piange senza occhi. Cos'è?", ans: "nuvola", hint: "Sta in cielo e porta la pioggia." },
      { desc: "Stanza 15: Ha le denti ma non morde. Cos'è?", ans: "pettine", hint: "Si usa sui capelli." },
      { desc: "Stanza 16: Cosa entra in acqua rosso ed esce nero?", ans: "ferro caldo", hint: "Si raffredda nell'acqua." },
      { desc: "Stanza 17: Più è nera, più è pulita. Cos'è?", ans: "lavagna", hint: "Si usa a scuola con i gessetti." },
      { desc: "Stanza 18: Se mi pronunci mi distruggi, se mi ignori ti proteggo. Cos'è?", ans: "incantesimo", hint: "Parola magica del castello." },
      { desc: "Stanza 19: Ha quattro gambe di legno ma non cammina. Cos'è?", ans: "tavolo", hint: "Ci si siede attorno per mangiare." },
      { desc: "Stanza 20: IL TRONO FINALE! Qual è l'animale che al mattino cammina a 4 gambe, al pomeriggio a 2 e alla sera a 3?", ans: "uomo", hint: "Rappresenta le fasi della vita." }
    ];

    let currentRoom = 0;
    let hp = 100;
    let hints = 3;
    let difficulty = 'normale';

    function startGame(mode) {
      difficulty = mode;
      currentRoom = 0;
      hp = 100;
      
      if (mode === 'facile') hints = 99;
      else if (mode === 'normale') hints = 3;
      else if (mode === 'esperto') hints = 0;

      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      loadRoom();
    }

    function loadRoom() {
      document.getElementById('room-num').innerText = currentRoom + 1;
      document.getElementById('hp-val').innerText = hp;
      document.getElementById('hints-val').innerText = hints === 99 ? '∞' : hints;
      document.getElementById('puzzle-desc').innerText = puzzles[currentRoom].desc;
      document.getElementById('answer-input').value = '';
      document.getElementById('feedback').innerText = '';
    }

    function checkAnswer() {
      const input = document.getElementById('answer-input').value.trim().toLowerCase();
      const target = puzzles[currentRoom].ans.toLowerCase();

      if (input.includes(target)) {
        document.getElementById('feedback').style.color = '#55ff55';
        document.getElementById('feedback').innerText = 'Corretto!';
        setTimeout(() => {
          currentRoom++;
          if (currentRoom >= puzzles.length) {
            alert('Congratulazioni! Hai completato Il Castello Incantato!');
            location.reload();
          } else {
            loadRoom();
          }
        }, 1000);
      } else {
        const damage = difficulty === 'esperto' ? 50 : (difficulty === 'normale' ? 25 : 10);
        hp -= damage;
        document.getElementById('hp-val').innerText = hp;
        document.getElementById('feedback').style.color = '#ff5555';
        document.getElementById('feedback').innerText = `Sbagliato! Sotto -${damage} HP`;

        if (hp <= 0) {
          alert('Sei stato sconfitto dai trabocchetti del castello!');
          location.reload();
        }
      }
    }

    function useHint() {
      if (hints <= 0) {
        document.getElementById('feedback').innerText = 'Nessun aiuto disponibile!';
        return;
      }
      if (hints !== 99) hints--;
      document.getElementById('hints-val').innerText = hints === 99 ? '∞' : hints;
      document.getElementById('feedback').style.color = '#e6c619';
      document.getElementById('feedback').innerText = 'Suggerimento: ' + puzzles[currentRoom].hint;
    }

    // Registrazione Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('SW Ok'))
          .catch(err => console.log('SW Err:', err));
      });
    }
  </script>
</body>
</html>

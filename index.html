<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il Castello Incantato</title>
  <meta name="theme-color" content="#2a1810">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a0f0a;
      color: #f4e8d1;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
      text-align: center;
    }
    .card {
      background: #2a1810;
      border: 3px solid #8b5a2b;
      border-radius: 12px;
      padding: 20px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }
    h1 { color: #d4af37; font-size: 1.8rem; margin-bottom: 8px; text-shadow: 1px 1px 3px #000; }
    h2 { color: #c0a060; font-size: 1.1rem; margin-bottom: 20px; font-style: italic; }
    .btn {
      display: block;
      width: 100%;
      background: #5a2a18;
      color: #fff;
      border: 2px solid #8b5a2b;
      padding: 14px;
      margin: 10px 0;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:active { background: #8b5a2b; }
    .status-bar {
      display: flex;
      justify-content: space-around;
      background: #150a06;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }
    .hidden { display: none; }
    .game-text { text-align: left; font-size: 1rem; line-height: 1.5; margin-bottom: 15px; }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #8b5a2b;
      background: #150a06;
      color: #fff;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="card" id="menu-screen">
    <h1>IL CASTELLO INCANTATO</h1>
    <h2>La Corona Dorata & La Lucciola Magica</h2>
    
    <p style="margin-bottom: 20px;">Scegli il livello adatto a te:</p>
    
    <button class="btn" onclick="startGame('facile')">🟢 BAMBINI (5-7 Anni)<br><small>Indovinelli semplici e aiuti continui</small></button>
    <button class="btn" onclick="startGame('normale')">🔥 RAGAZZI (8-12 Anni)<br><small>Logica e rompicapo classici</small></button>
    <button class="btn" onclick="startGame('esperto')">👑 ADULTI / ESPERTO<br><small>Enigmi complessi e logica avanzata</small></button>
  </div>

  <div class="card hidden" id="game-screen">
    <div class="status-bar">
      <div>Stanza: <span id="room-num">1</span>/20</div>
      <div>HP: <span id="hp-val">100</span></div>
      <div>Aiuti: <span id="hints-val">3</span></div>
    </div>
    
    <div class="game-text" id="puzzle-desc">Descrizione enigma...</div>
    
    <div id="answer-container">
      <input type="text" id="answer-input" placeholder="Inserisci la risposta...">
      <button class="btn" onclick="checkAnswer()">Conferma Risposta</button>
      <button class="btn" id="hint-btn" style="background: #3a4a18;" onclick="useHint()">Chiedi Aiuto</button>
    </div>
    <div id="feedback" style="margin-top: 10px; font-weight: bold;"></div>
  </div>

  <script>
    const puzzlesFacile = [
      { desc: "Stanza 1: Ha quattro gambe ma non cammina mai. Cos'è?", ans: "tavolo", hint: "Ci mangi sopra ogni giorno." },
      { desc: "Stanza 2: Più è sporca, più diventa bianca. Cos'è?", ans: "lavagna", hint: "Si usa a scuola con i gessetti." },
      { desc: "Stanza 3: Ha i denti ma non morde. Cos'è?", ans: "pettine", hint: "Serve per ordinare i capelli." },
      { desc: "Stanza 4: Si apre quando piove e si chiude quando c'è il sole. Cos'è?", ans: "ombrello", hint: "Ti protegge dall'acqua." },
      { desc: "Stanza 5: Vola senza ali e piange senza occhi. Cos'è?", ans: "nuvola", hint: "Sta in alto nel cielo." },
      { desc: "Stanza 6: Fa 'Mao' e ama il latte. Chi è?", ans: "gatto", hint: "Un piccolo animale domestico." },
      { desc: "Stanza 7: Ha il guscio e va lentissima. Chi è?", ans: "tartaruga", hint: "Porta la sua casa sulla schiena." },
      { desc: "Stanza 8: Gira intorno alla Terra e brilla di notte. Cos'è?", ans: "luna", hint: "L'astro della notte." },
      { desc: "Stanza 9: Ha molti colori e appare dopo la pioggia col sole. Cos'è?", ans: "arcobaleno", hint: "Un arco colorato nel cielo." },
      { desc: "Stanza 10: È rosso e si mangia sulla pizza. Cos'è?", ans: "pomodoro", hint: "Un ortaggio rosso." },
      { desc: "Stanza 11: Se lo lasci cadere si rompe, se gli sorridi ti sorride. Cos'è?", ans: "specchio", hint: "Riflette la tua immagine." },
      { desc: "Stanza 12: Ha la chioma ma non ha i capelli. Cos'è?", ans: "albero", hint: "Ha rami e foglie." },
      { desc: "Stanza 13: Ti segue sempre dove c'è luce. Cos'è?", ans: "ombra", hint: "È scura e cammina con te." },
      { desc: "Stanza 14: Ha una coda di paglia e serve per pulire. Cos'è?", ans: "scopa", hint: "La usa la strega per volare." },
      { desc: "Stanza 15: Suona la mattina per svegliarti. Cos'è?", ans: "sveglia", hint: "Fa din-don o bip-bip." },
      { desc: "Stanza 16: Ha la buccia gialla ed è la scimmia che lo ama. Cos'è?", ans: "banana", hint: "Un frutto giallo." },
      { desc: "Stanza 17: Cammina con la casa addosso ma non è la tartaruga. Chi è?", ans: "chiocciola", hint: "Lenta e con le cornine." },
      { desc: "Stanza 18: Se lo soffii vola via ed è pieno d'aria. Cos'è?", ans: "palloncino", hint: "Si usa alle feste di compleanno." },
      { desc: "Stanza 19: Si mette ai piedi prima delle scarpe. Cosa sono?", ans: "calze", hint: "Tengono i piedi al caldo." },
      { desc: "Stanza 20: STANZA DEL TESORO! Qual è la parola magica per aprire il baule?", ans: "apriti sesamo", hint: "La famosa frase di Alì Babà." }
    ];

    const puzzlesNormale = [
      { desc: "Stanza 1: Ho un collo ma non la testa. Cosa sono?", ans: "bottiglia", hint: "Contiene liquidi." },
      { desc: "Stanza 2: Più ne togli, più ne lasci dietro di te. Cosa sono?", ans: "passi", hint: "Li fai camminando." },
      { desc: "Stanza 3: Ho le chiavi ma non apro nessuna porta. Chi sono?", ans: "pianoforte", hint: "Produce note musicali." },
      { desc: "Stanza 4: Passo attraverso il vetro senza romperlo. Cosa sono?", ans: "luce", hint: "Illumina la stanza." },
      { desc: "Stanza 5: Completa la sequenza: 2, 4, 8, 16, ...?", ans: "32", hint: "Raddoppia ogni numero." },
      { desc: "Stanza 6: Più sono caldo, più sono fresco. Cosa sono?", ans: "pane", hint: "Appena sfornato dal fornaio." },
      { desc: "Stanza 7: Vado su e giù senza mai muovermi. Cosa sono?", ans: "scala", hint: "Collega due piani." },
      { desc: "Stanza 8: Ha una testa e una coda, ma nessun corpo. Cos'è?", ans: "moneta", hint: "Si usa per tirare a sorte." },
      { desc: "Stanza 9: Si spezza appena dici il suo nome. Cos'è?", ans: "silenzio", hint: "L'assenza di rumore." },
      { desc: "Stanza 10: Se mi hai vuoi condividerlo, ma se lo condividi non lo hai più. Cos'è?", ans: "segreto", hint: "Non va confidato." },
      { desc: "Stanza 11: Ho molte pagine ma non so parlare. Cosa sono?", ans: "libro", hint: "Custodisce storie." },
      { desc: "Stanza 12: Quale parola diventa più corta se le aggiungi due lettere?", ans: "corta", hint: "È un gioco di parole letterale." },
      { desc: "Stanza 13: Appartiene a te, ma gli altri lo usano più di te. Cos'è?", ans: "nome", hint: "Te lo hanno dato alla nascita." },
      { desc: "Stanza 14: Entra in acqua rosso ed esce nero. Cos'è?", ans: "ferro caldo", hint: "Si raffredda quando viene immerso." },
      { desc: "Stanza 15: Se mi pronunci mi distruggi. Cos'è?", ans: "silenzio", hint: "L'assenza assoluta di suoni." },
      { desc: "Stanza 16: Cosa ha molti occhi ma non può vedere?", ans: "patata", hint: "Un tubero da cucinare." },
      { desc: "Stanza 17: Cosa sale quando la pioggia scende?", ans: "ombrello", hint: "Lo alzi sopra la testa." },
      { desc: "Stanza 18: Se mi compri sono nero, se mi usi sono rosso, se mi getti sono grigio. Cos'è?", ans: "carbone", hint: "Si usa per il barbecue." },
      { desc: "Stanza 19: Ha un braccio solo ma indica molte strade. Cos'è?", ans: "cartello", hint: "Segnale stradale." },
      { desc: "Stanza 20: TRONO FINALE! Qual è l'animale che al mattino va a 4 zampe, al pomeriggio a 2 e alla sera a 3?", ans: "uomo", hint: "Rappresenta le fasi della vita." }
    ];

    const puzzlesEsperto = [
      { desc: "Stanza 1: Un padre e un figlio hanno 66 anni in totale. L'età del padre è l'inverso di quella del figlio. Quanti anni hanno? (Scrivi es: 60 e 6)", ans: "60 e 6", hint: "Considera coppie di cifre invertite come 60 e 06 oppure 51 e 15." },
      { desc: "Stanza 2: Più mi tiri, più divento corto. Che cosa sono?", ans: "sigaretta", hint: "Consumandosi si accorcia." },
      { desc: "Stanza 3: Sono leggero come una piuma, ma nemmeno l'uomo più forte del mondo può tenermi per più di 5 minuti. Cos'è?", ans: "respiro", hint: "Devi trattenere l'aria." },
      { desc: "Stanza 4: In un'isola ci sono 3 interruttori fuori da una stanza chiusa. Uno aziona la lampadina dentro. Puoi entrare una sola volta. Come capisci qual è?", ans: "calore", hint: "La lampadina accesa da tempo si scalda." },
      { desc: "Stanza 5: Completa la serie logica: 1, 11, 21, 1211, 111221, ...?", ans: "312211", hint: "Descrivi a voce la sequenza precedente (un uno, due uno...)." },
      { desc: "Stanza 6: Se due scimmie impiegano 2 minuti per mangiare 2 banane, quante scimmie servono per mangiare 18 banane in 18 minuti?", ans: "2", hint: "Il tasso di consumo per scimmia resta invariato." },
      { desc: "Stanza 7: Non ho mai risposto ma mi fanno continuamente domande. Chi sono?", ans: "telefono", hint: "Squilla per essere risposto." },
      { desc: "Stanza 8: Può viaggiare in tutto il mondo rimanendo sempre nello stesso angolo. Cos'è?", ans: "francobollo", hint: "Sta sull'busta della lettera." },
      { desc: "Stanza 9: Che cosa cresce continuamente senza mai diminuire?", ans: "età", hint: "Aumenta ogni anno." },
      { desc: "Stanza 10: Sono l'inizio di tutto, la fine di ogni tempo e di ogni spazio. Cosa sono?", ans: "e", hint: "Guarda la lettera iniziale e finale delle parole." },
      { desc: "Stanza 11: Se mi trovi in una stanza buia con un fiammifero, una lampada a olio e una stufa a legna, cosa accendi per primo?", ans: "fiammifero", hint: "Senza questo non accendi il resto." },
      { desc: "Stanza 12: Due madri e due figlie vanno a cena. Mangiano 3 mele in totale ed ognuna ne mangia una intera. Com'è possibile?", ans: "nonna", hint: "Sono 3 persone: nonna, madre e figlia." },
      { desc: "Stanza 13: Più ne fai, più ne lasci indietro. Cosa sono?", ans: "impronte", hint: "Lasciate dai passi." },
      { desc: "Stanza 14: Non ha peso, ma se la metti in una botte la rende più leggera. Cos'è?", ans: "buco", hint: "Toglie materiale." },
      { desc: "Stanza 15: Qual è l'unico numero che ha lo stesso numero di lettere del suo valore numerico (in italiano)?", ans: "tre", hint: "T-R-E sono 3 lettere." },
      { desc: "Stanza 16: Dove il martedì viene prima del lunedì?", ans: "dizionario", hint: "Ordine alfabetico." },
      { desc: "Stanza 17: Qual è la cosa che tutti sanno fare contemporaneamente al mondo?", ans: "invecchiare", hint: "Accade ad ogni secondo." },
      { desc: "Stanza 18: Se una macchina elettrica viaggia a sud a 100 km/h, verso dove va il fumo?", ans: "nessuna parte", hint: "È un veicolo elettrico." },
      { desc: "Stanza 19: Ha un occhio solo ma non vede nulla. Cos'è?", ans: "ago", hint: "Serve per cucire." },
      { desc: "Stanza 20: ENIGMA FINALE DEL CASTELLO: Cos'è che non è stato mai visto, non esiste ora, ma esisterà sempre domani?", ans: "futuro", hint: "Ci arrivi giorno dopo giorno." }
    ];

    let activePuzzles = [];
    let currentRoom = 0;
    let hp = 100;
    let hints = 3;
    let difficulty = 'normale';

    function startGame(mode) {
      difficulty = mode;
      currentRoom = 0;
      hp = 100;
      
      if (mode === 'facile') {
        activePuzzles = puzzlesFacile;
        hints = 99;
      } else if (mode === 'normale') {
        activePuzzles = puzzlesNormale;
        hints = 3;
      } else if (mode === 'esperto') {
        activePuzzles = puzzlesEsperto;
        hints = 0;
      }

      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      loadRoom();
    }

    function loadRoom() {
      document.getElementById('room-num').innerText = currentRoom + 1;
      document.getElementById('hp-val').innerText = hp;
      document.getElementById('hints-val').innerText = hints === 99 ? '∞' : hints;
      document.getElementById('puzzle-desc').innerText = activePuzzles[currentRoom].desc;
      document.getElementById('answer-input').value = '';
      document.getElementById('feedback').innerText = '';
    }

    function checkAnswer() {
      const input = document.getElementById('answer-input').value.trim().toLowerCase();
      const target = activePuzzles[currentRoom].ans.toLowerCase();

      if (input.includes(target)) {
        document.getElementById('feedback').style.color = '#55ff55';
        document.getElementById('feedback').innerText = 'Corretto!';
        setTimeout(() => {
          currentRoom++;
          if (currentRoom >= activePuzzles.length) {
            alert('Congratulazioni! Hai completato Il Castello Incantato!');
            location.reload();
          } else {
            loadRoom();
          }
        }, 1000);
      } else {
        const damage = difficulty === 'esperto' ? 50 : (difficulty === 'normale' ? 25 : 10);
        hp -= damage;
        document.getElementById('hp-val').innerText = hp;
        document.getElementById('feedback').style.color = '#ff5555';
        document.getElementById('feedback').innerText = `Sbagliato! -${damage} HP`;

        if (hp <= 0) {
          alert('Sei stato sconfitto dai misteri del castello!');
          location.reload();
        }
      }
    }

    function useHint() {
      if (hints <= 0) {
        document.getElementById('feedback').innerText = 'Nessun aiuto disponibile per questa modalità!';
        return;
      }
      if (hints !== 99) hints--;
      document.getElementById('hints-val').innerText = hints === 99 ? '∞' : hints;
      document.getElementById('feedback').style.color = '#e6c619';
      document.getElementById('feedback').innerText = 'Suggerimento: ' + activePuzzles[currentRoom].hint;
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA Ready'))
          .catch(err => console.log('SW Error:', err));
      });
    }
  </script>
</body>
</html>
